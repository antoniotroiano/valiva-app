name: Release

# Runs after the CI workflow has finished on a push to main. If CI was green and package.json carries a
# version without a tag yet, it creates the tag and the GitHub release, then deploys exactly that commit to
# GitHub Pages. See docs/releasing.md.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Only a successful CI run of a push to main in this repository (not a pull request, not a fork).
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: write # only this job: it creates the tag and the release
    outputs:
      released: ${{ steps.publish.outputs.released }}
      sha: ${{ github.event.workflow_run.head_sha }}
    steps:
      # The commit CI tested, not the current tip of main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Check version and changelog, extract release notes
        id: check
        run: node tools/release-check.mjs --notes "$RUNNER_TEMP/release-notes.md"
      - name: Create tag and release if the tag does not exist yet
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.version }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          if out=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" 2>&1); then
            echo "Tag ${tag} already exists, nothing to do."
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          elif ! grep -q "HTTP 404" <<< "$out"; then
            echo "Could not check for tag ${tag}: ${out}" >&2
            exit 1
          fi
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --title "$tag" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
          echo "Created release ${tag} at ${SHA}."
          echo "released=true" >> "$GITHUB_OUTPUT"

  pages:
    # A push to main alone does not publish the site any more: only a new release does.
    needs: release
    if: needs.release.outputs.released == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      ref: ${{ needs.release.outputs.sha }}
